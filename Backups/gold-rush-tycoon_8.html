<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gold Rush Tycoon</title>
<style>
:root{--rock:#2b1d14;--gold:#ffc83d;--gold2:#e8962a;--ink:#fff4dc;--bad:#6b5a4c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#120b07;color:var(--ink);font:600 14px/1.2 "Trebuchet MS","Segoe UI",sans-serif;overflow:hidden}
#app{width:100vw;height:100vh;height:100dvh;margin:0;display:flex;flex-direction:column;background:var(--rock)}
#hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:linear-gradient(#4a2f1c,#3a2415);border-bottom:3px solid #1b110a}
#cash{font-size:26px;font-weight:900;color:var(--gold);text-shadow:0 2px 0 #7a3f0c;min-width:150px}
#rate{font-size:12px;opacity:.8;display:block;font-weight:600;color:var(--ink);text-shadow:none}
#hud .sp{flex:1}
button{font:inherit;color:#3b1d05;border:0;border-radius:8px;padding:6px 10px;cursor:pointer;background:linear-gradient(#ffd96b,var(--gold2));box-shadow:0 3px 0 #8a4d0e;transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #8a4d0e}
button.dis{background:var(--bad);color:#c9b8a8;box-shadow:0 3px 0 #3a2f27}
button.alt{background:linear-gradient(#9be27a,#4fa23a);box-shadow:0 3px 0 #2c6320;color:#10300a}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#mine{flex:1;overflow-y:auto;overflow-x:hidden}
#world{position:relative}
#cv{position:absolute;left:0;top:0;pointer-events:none}
#rows{position:relative}
.row{height:100px;position:relative;cursor:pointer}
.grp{position:absolute;display:flex;gap:6px}
.grp button{font-size:11px;line-height:1.25;padding:4px 3px;min-height:40px}
.grp .up{width:78px}.grp .mg{width:62px}
.g-s{right:10px;top:26px}.g-e,.g-w{left:0;top:0}   /* building button groups are positioned from JS (see placeBtns) */
.act{position:absolute;left:50%;top:26px;transform:translateX(-35%);min-width:170px;min-height:44px;font-size:13px}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:5}
#modal.on{display:flex}
#box{background:#34241a;border:3px solid var(--gold2);border-radius:14px;padding:20px;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:12px}
#box h2{margin:0;color:var(--gold);font-size:22px}
#box .bt{display:flex;gap:8px;justify-content:center}
@media (max-width:560px){#cash{font-size:22px}.act{transform:translateX(-50%);min-width:150px}}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="cash"></div>
    <div class="sp"></div>
    <button id="bmode">Buy x1</button>
    <button id="bad" class="alt">Watch ad: 2x cash</button>
    <button id="bpre">Reinvest</button>
  </div>
  <div id="mine"><div id="world"><canvas id="cv"></canvas><div id="rows"></div></div></div>
</div>
<div id="modal"><div id="box"></div></div>

<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js" onerror="void 0"></script>
<script>
"use strict";
/* ---------- constants & helpers ---------- */
const RH = 100, EX = 56, CYC = 10, MAXS = 30, FREE = 10, B = 4.5, SAVE = "goldRushTycoon_v2";
const START_CASH = 1000000;   // cash of a fresh game (new game and Reinvest); saved games keep their own cash
const SURF_FRAC = 0.5, SURF_MIN = 150, ELEV_SHIFT = 0.1;   // surface (row 0) height = SURF_FRAC of the visible mine viewport (min SURF_MIN px); ELEV_SHIFT = share of the width the elevator sits towards the centre on wide screens
// live layout (recomputed every frame by layout()): SH = surface height = top y of shaft 1, sw = elevator shaft section width (stw = elevator station width),
// sx = elevator shaft centre x, tl = x where the tunnels start (right edge of the shaft)
const L = { SH: 200, s0: 200, sw: 64, stw: 64, sx: EX, tl: EX + 32 };
const MS = [10, 25, 50, 100, 150, 200, 300, 400, 500];
const SUF = ["K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc"];
const $ = s => document.querySelector(s);
const fmt = n => {
  if (n < 1000) return n < 10 ? (Math.round(n * 10) / 10) + "" : Math.floor(n) + "";
  let i = -1; while (n >= 1000 && i < SUF.length - 1) { n /= 1000; i++; }
  return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + SUF[i];
};
const mult = l => 2 ** MS.filter(m => l >= m).length;
const nextMs = l => MS.find(m => m > l);

/* ---------- state ---------- */
const mkShaft = () => ({ lvl: 1, mgr: 0, stock: 0, t: -1 });
const fresh = (gems = 0, total = 0) => ({
  cash: START_CASH, run: 0, total, gems, boostT: 0,
  shafts: [mkShaft()], cleared: {}, clr: null,
  el: { lvl: 1, mgr: 0, t: -1, load: 0 },
  wh: { lvl: 1, mgr: 0, t: -1, stock: 0, load: 0 },
  ts: Date.now()
});
let S = fresh(), buyMode = 1, T = 0, floats = [], refs = [];
const spawnAt = {};   // shaft index -> time T its elevator-shaft section was unlocked (drives the slide-in)

const N = () => S.shafts.length;
const gm = () => 1 + 0.2 * S.gems;
const adm = () => S.boostT > 0 ? 2 : 1;
const yieldS = i => 10 * B ** i * S.shafts[i].lvl * mult(S.shafts[i].lvl);
const capE = () => 45 * S.el.lvl * mult(S.el.lvl) * B ** (N() - 1);
const capW = () => 40 * S.wh.lvl * mult(S.wh.lvl) * B ** (N() - 1);
const tripE = () => (N() * 0.8 + 1.2) / (1 + 0.03 * S.el.lvl);
const cycW = () => 8 / (1 + 0.03 * S.wh.lvl);

/* costs (cheap early game) */
const costK = (c0, g, l, k) => c0 * g ** (l - 1) * (g ** k - 1) / (g - 1);
function plan(c0, g, l) {
  let k = buyMode;
  if (buyMode === "max") { k = 0; while (k < 1000 && costK(c0, g, l, k + 1) <= S.cash) k++; k = Math.max(1, k); }
  return { k, cost: costK(c0, g, l, k) };
}
const dept = (kind, i) =>
  kind === "s" ? { o: S.shafts[i], c0: 20 * 5 ** i, g: 1.15, mc: 50 * 5 ** i }
  : kind === "e" ? { o: S.el, c0: 30 * 3.5 ** (N() - 1), g: 1.16, mc: 80 }
  : { o: S.wh, c0: 35 * 3.5 ** (N() - 1), g: 1.16, mc: 150 };
const openCost = i => 80 * 5 ** (i - 1);                  // i = 0-based index of the shaft to open (i >= 1)

/* obstacles: shafts 1-10 are free, then 11, 16, 21, 26 are blocked */
const isObs = n => n > FREE && (n - FREE - 1) % 5 === 0;  // n = 1-based shaft number
const blocked = i => isObs(i + 1) && !S.cleared[i + 1];
const clearCost = n => Math.round(openCost(n - 1) * 0.5);
const clearTime = n => 10 + (n - FREE - 1);               // 10s, 15s, 20s, 25s
function status(i) {
  if (i < N()) return "own";
  if (i === N()) return blocked(i) ? (S.clr && S.clr.n === i + 1 ? "clearing" : "blocked") : "open";
  return blocked(i) ? "farblock" : "locked";
}

/* ---------- economy ---------- */
function rate() {
  let sr = 0; S.shafts.forEach((s, i) => { if (s.mgr) sr += yieldS(i) / CYC; });
  const er = S.el.mgr ? capE() / (2 * tripE()) : 0, wr = S.wh.mgr ? capW() / cycW() : 0;
  return Math.min(sr, er, wr) * gm() * adm();
}
function earn(v) { S.cash += v; S.run += v; S.total += v; }
function float(txt, x, y, col = "#ffd96b") { floats.push({ txt, x, y, t: 0, col }); }
function startE() { if (S.el.t < 0 && S.shafts.some(s => s.stock > 0)) { S.el.t = 0; S.el.load = 0; } }
function startW() { const W = S.wh; if (W.t < 0 && W.stock > 0) { W.load = Math.min(W.stock, capW()); W.stock -= W.load; W.t = 0; } }

function tick(dt) {
  T += dt;
  if (S.boostT > 0) S.boostT = Math.max(0, S.boostT - dt);
  if (S.clr) { S.clr.t += dt; if (S.clr.t >= S.clr.dur) { S.cleared[S.clr.n] = 1; S.clr = null; } }
  S.shafts.forEach((s, i) => {
    if (s.t < 0 && s.mgr) s.t = 0;
    if (s.t >= 0) {
      s.t += dt;
      if (s.t >= CYC) { const y = yieldS(i); s.stock += y; float("+" + fmt(y), L.tl + 28, L.s0 + i * RH + 50, "#e8c27a"); s.t = s.mgr ? 0 : -1; }
    }
  });
  const E = S.el, trip = tripE();
  if (E.mgr) startE();
  if (E.t >= 0) {
    const prev = E.t; E.t += dt;
    if (prev < trip) S.shafts.forEach((s, i) => {
      const at = trip * (i + 1) / N();
      if (prev < at && E.t >= at) { const take = Math.min(capE() - E.load, s.stock); s.stock -= take; E.load += take; }
    });
    if (E.t >= 2 * trip) { S.wh.stock += E.load; E.load = 0; E.t = -1; }
  }
  const W = S.wh;
  if (W.mgr) startW();
  if (W.t >= 0) {
    const c = cycW(), prev = W.t; W.t += dt;
    if (prev < c / 2 && W.t >= c / 2) {
      const gain = W.load * gm() * adm(); earn(gain); W.load = 0;
      const R = bRect(ART.warehouse); float("+$" + fmt(gain), R.x + R.w / 2, R.y + 6, "#9be27a");
    }
    if (W.t >= c) W.t = -1;
  }
  floats.forEach(f => f.t += dt); floats = floats.filter(f => f.t < 1.2);
}

/* ---------- actions ---------- */
function tap(kind, i) {
  gp(true);
  if (kind === "s") {
    if (i < N()) { const s = S.shafts[i]; if (s.t < 0) s.t = 0; }
    else if (S.clr && S.clr.n === i + 1) S.clr.t += 0.5;   // tapping speeds up clearing
  } else if (kind === "e") startE(); else startW();
}
function upgrade(kind, i) {
  const d = dept(kind, i), p = plan(d.c0, d.g, d.o.lvl);
  if (S.cash >= p.cost) { S.cash -= p.cost; d.o.lvl += p.k; }
}
function hire(kind, i) { const d = dept(kind, i); if (!d.o.mgr && S.cash >= d.mc) { S.cash -= d.mc; d.o.mgr = 1; } }
function act(i) {
  const st = status(i), n = i + 1;
  if (st === "open" && N() < MAXS && S.cash >= openCost(i)) { S.cash -= openCost(i); S.shafts.push(mkShaft()); spawnAt[N() - 1] = T; }
  else if (st === "blocked" && S.cash >= clearCost(n)) { S.cash -= clearCost(n); S.clr = { n, t: 0, dur: clearTime(n) }; }
}
const gain = () => Math.floor(Math.sqrt(S.run / 5e5));

/* ---------- CrazyGames SDK (safe if missing) ---------- */
const SDK = () => window.CrazyGames && window.CrazyGames.SDK;
let sdkReady = false, playing = false;
(async () => { try { await SDK().init(); sdkReady = true; SDK().game.loadingStop && SDK().game.loadingStop(); } catch (e) {} })();
function gp(on) {
  if (on === playing) return; playing = on;
  try { if (sdkReady) on ? SDK().game.gameplayStart() : SDK().game.gameplayStop(); } catch (e) {}
}
function rewarded(done) {
  if (!sdkReady) return done(); // local testing: grant directly
  try { SDK().ad.requestAd("rewarded", { adStarted: () => gp(false), adFinished: () => { done(); gp(true); }, adError: () => gp(true) }); }
  catch (e) { /* ad failed, no reward */ }
}

/* ---------- DOM: buttons live on the buildings / mining areas ---------- */
const rowsEl = $("#rows"), mineEl = $("#mine"), world = $("#world"), cv = $("#cv"), g = cv.getContext("2d");
function mkRow(kind, i, host) {     // host: reuse an existing row element (the elevator buttons live on the surface row)
  const d = host || document.createElement("div"); if (!host) d.className = "row";
  const r = { kind, i, d };
  if (!host) d.onclick = kind === "w" ? ev => tap(surfaceHit(ev, d), 0) : () => tap(kind, i);
  const grp = document.createElement("div"); grp.className = "grp g-" + kind;
  grp.innerHTML = '<button class="up"></button><button class="mg"></button>';
  r.grp = grp; r.up = grp.children[0]; r.mg = grp.children[1];
  r.up.onclick = e => { e.stopPropagation(); upgrade(kind, i); };
  r.mg.onclick = e => { e.stopPropagation(); hire(kind, i); };
  d.appendChild(grp);
  if (kind === "s") {
    r.act = document.createElement("button"); r.act.className = "act";
    r.act.onclick = e => { e.stopPropagation(); act(i); }; d.appendChild(r.act);
  }
  if (!host) rowsEl.appendChild(d); refs.push(r);
}
// a tap on the surface row goes to whichever building (elevator station / warehouse) is nearer
function surfaceHit(ev, d) {
  const x = ev.clientX - d.getBoundingClientRect().left, ER = bRect(ART.elevator), WR = bRect(ART.warehouse);
  return x < (ER.x + ER.w + WR.x) / 2 ? "e" : "w";
}
function build() {
  rowsEl.innerHTML = ""; refs = [];
  mkRow("w", 0); mkRow("e", 0, refs[0].d);
  for (let i = 0; i < MAXS; i++) mkRow("s", i);
}
function layout() {   // surface = SURF_FRAC of the viewport; the shafts start right below it
  const vw = world.clientWidth;
  const sh = Math.max(SURF_MIN, Math.round(mineEl.clientHeight * SURF_FRAC));
  L.SH = L.s0 = sh;
  L.stw = bSize(ART.elevator).w;                                                       // elevator station width
  L.sw = ART.shaft.width > 0 ? Math.round(ART.shaft.width) : Math.round(L.stw * ART.shaft.scale);   // shaft section width (default = station width)
  const sx0 = Math.max(EX, Math.round(Math.max(L.stw, L.sw) / 2) + 10);                // shaft / station centre, clear of the left edge
  L.sx = sx0 + (vw >= 700 ? Math.round(vw * ELEV_SHIFT) : 0);                          // fixed 10% shift towards the centre (wide screens)
  L.tl = L.sx - Math.round(L.sw / 2) + L.sw;                                           // tunnels start at the shaft's right edge
  const r0 = refs[0]; if (r0 && r0.hh !== sh) { r0.hh = sh; r0.d.style.height = sh + "px"; }
}
const set = (el, t) => { if (el._t !== t) { el._t = t; el.innerHTML = t; } };
const dis = (el, off) => el.classList.toggle("dis", !!off);
function ui() {
  set($("#cash"), "$" + fmt(S.cash) + '<span id="rate">≈ $' + fmt(rate()) + "/s auto" + (S.boostT > 0 ? " · 2x " + Math.ceil(S.boostT) + "s" : "") + "</span>");
  set($("#bmode"), "Buy " + (buyMode === "max" ? "MAX" : "x" + buyMode));
  const gn = gain();
  set($("#bpre"), "Reinvest" + (gn ? " +" + gn + " ★" : "") + (S.gems ? " (★" + S.gems + ")" : ""));
  dis($("#bpre"), !gn);
  refs.forEach(r => {
    const st = r.kind === "s" ? status(r.i) : "own";
    r.grp.style.display = st === "own" ? "flex" : "none";
    if (r.act) {
      let t = "";
      if (st === "open") t = "Open shaft " + (r.i + 1) + "<br>$" + fmt(openCost(r.i));
      else if (st === "blocked") t = "Clear boulders<br>$" + fmt(clearCost(r.i + 1)) + " · " + clearTime(r.i + 1) + "s";
      r.act.style.display = t ? "" : "none"; set(r.act, t);
      dis(r.act, st === "open" ? S.cash < openCost(r.i) : S.cash < clearCost(r.i + 1));
    }
    if (st !== "own") return;
    const d = dept(r.kind, r.i), o = d.o, p = plan(d.c0, d.g, o.lvl);
    set(r.up, "Level +" + p.k + "<br>$" + fmt(p.cost)); dis(r.up, S.cash < p.cost);
    set(r.mg, o.mgr ? "Auto ✓" : "Manager<br>$" + fmt(d.mc)); dis(r.mg, o.mgr || S.cash < d.mc);
  });
}

/* ---------- drawing ---------- */
function nugget(x, y, r) { g.fillStyle = "#ffc83d"; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.fillStyle = "#fff0a8"; g.beginPath(); g.arc(x - r / 3, y - r / 3, r / 3, 0, 7); g.fill(); }
function boulder(x, y, r) { g.fillStyle = "#6f6a64"; g.beginPath(); g.ellipse(x, y, r, r * 0.8, 0, 0, 7); g.fill(); g.fillStyle = "#8d877f"; g.beginPath(); g.ellipse(x - r / 3, y - r / 3, r / 3, r / 4, 0, 0, 7); g.fill(); }
function txt(s, x, y, size, col, al) { g.font = "bold " + size + "px 'Trebuchet MS',sans-serif"; g.textAlign = al || "left"; g.fillStyle = col; g.fillText(s, x, y); }
function man(x, y, col, carry, ang) {
  g.fillStyle = col; g.fillRect(x - 5, y - 22, 10, 16);
  g.fillStyle = "#2a2a2a"; g.fillRect(x - 5, y - 6, 4, 6); g.fillRect(x + 1, y - 6, 4, 6);
  g.fillStyle = "#f0c8a0"; g.fillRect(x - 4, y - 28, 8, 6);
  g.fillStyle = "#f4c542"; g.beginPath(); g.arc(x, y - 27, 6, Math.PI, 0); g.fill();
  if (ang !== null) { g.strokeStyle = "#d8d8d8"; g.lineWidth = 3; g.beginPath(); g.moveTo(x + 4, y - 16); g.lineTo(x + 4 + Math.cos(ang) * 16, y - 16 + Math.sin(ang) * 16); g.stroke(); }
  if (carry) nugget(x - 8, y - 14, 5);
}
/* ================= SURFACE / BUILDING ART =================
   Every image is optional: if a file is missing the old procedural drawing is used instead.
   Buildings: x = left edge, bottom = ground line (game px, world coords), h = on-screen height;
   width follows the image's aspect ratio. btn.dx / btn.dy nudge the button group (default: centred
   horizontally, sitting near the bottom of the building). */
const val = v => typeof v === "function" ? v() : v;
const bH = () => Math.min(200, Math.max(96, Math.round(L.SH * 0.6)));   // both surface buildings share one height + baseline
const levelH = () => RH + ART.tunnel.overlapV;   // drawn height of one level's tunnel AND its elevator-shaft section: one level + the overlap onto the next
const ART = {
  background: { src: ["img/background.png", "img/bg.png"], fit: "stretch" },   // fit: "stretch" (fill the surface) | "cover" (keep aspect, crop)
  // building size: scale (multiplier on the base size), or width / height in px (width wins, then height; the other follows the aspect ratio)
  // both key buildings stand on the surface (row 0) on the same ground line: elevator station left, warehouse right (also the sell point)
  warehouse:  { src: "img/warehouse.png", right: 10, bottom: () => L.SH, h: bH, fallbackAR: 262 / 96, maxW: 0.44, scale: 1, width: 0, height: 0, btn: { dx: 0, dy: 0 } },
  elevator:   { src: "img/elevator_station.png", x: () => L.sx - Math.round(L.stw / 2), bottom: () => L.SH, h: bH, fallbackAR: 250 / 90, maxW: 0.44, scale: 1, width: 0, height: 0, btn: { dx: 0, dy: 0 } },
  // repeating tunnel section, drawn for every owned shaft (aspect ratio always kept, never cropped). SIZE CONTROLS:
  //   scale: multiplier on the base size (1 = as tall as one level + overlapV; 0.8 = 20% smaller; 1.25 = 25% bigger)
  //   width: if > 0, the exact rendered width of ONE section in px (overrides scale; height follows the aspect ratio)
  // The mine's rows (RH pitch, level height, floor line, shaft sections, cabin stops) never depend on these: the art is simply anchored on each
  // level's bottom edge, so a smaller section leaves bare rock above it and a bigger one grows upward over the level above.
  // A tunnel is ALWAYS exactly `sections` sections long (never trimmed, whatever scale / width you set; a bigger size just makes the tunnel
  // longer, and the part beyond the screen edge is cut off by the screen), each overlapping its neighbour by `overlap` px; floor = px above a level's bottom edge where
  // the walking path is. overlapV = how far each level's strip reaches down over the next one (row geometry, not art size).
  tunnel:     { src: ["img/tunnel_section.png", "img/tunnel.png"], sections: 10, overlap: 4, overlapV: 11, floor: 27, scale: 1.5, width: 0 },
  // elevator shaft section: one per unlocked level, the far-left anchor of that level's row (the first tunnel section overlaps it by
  // tunnel.overlap px). Its size follows the elevator station: scale 1 = exactly as wide as the station, scale 1.2 = 20% wider; width > 0 sets
  // the exact px width instead. Height follows its aspect ratio. Sections are layered top-to-bottom: each lower one is drawn over the one
  // above. A newly unlocked level's row slides/fades in over `spawn` seconds.
  shaft:      { src: ["img/elevator_shaft_section.png", "img/elevator_section.png"], scale: 1, width: 0, spawn: 0.45 },
  // elevator cabin: drawn in front of the shaft sections. scale 1 = exactly as wide as the shaft section (so as the station by default);
  // width > 0 sets the exact px width. Height from its aspect ratio; only the part below the surface is shown, so at rest it stays hidden
  cabin:      { src: ["img/elevator_cabin.png", "img/elevator.png"], scale: 1, width: 0 },
  // ore spot where the miners dig: `count` sprites in a row, each overlapping the previous one by `overlap` px, right after the end of the row's
  // tunnel and drawn in front of the tunnel art. Generated with every level's row. h = base on-screen height (aspect kept, capped at maxW wide);
  // scale / width resize it like the other pieces; lift = px the spots are raised above the floor line. x / y = extra offset of the whole group
  // in px (x > 0 moves it right, y > 0 moves it down; the miners follow the x shift). Depth: the further right a spot is, the further back it sits
  // (the leftmost spot is drawn on top of its right-hand neighbours). They sit right after the tunnel's last section, or
  // (when the tunnel is longer) in front of its end just left of the button area; fewer spots are drawn only when the screen is too narrow.
  ore:        { src: ["img/ore_spot.png", "img/ore.png"], h: 78, maxW: 120, scale: 1.58, width: 0, count: 2, overlap: 25, lift: 41, x: 200, y: 0 }
};
function loadImg(srcs) {
  const list = [].concat(srcs); let i = 0; const im = new Image();
  im.onload = () => { im.ok = true; };
  im.onerror = () => { if (++i < list.length) im.src = list[i]; else console.warn("Image failed to load:", list.join(" / ")); };
  im.src = list[0]; return im;
}
function drawCover(im, x, y, w, h) {   // fill w x h keeping the image's aspect ratio (any overflow is centre-cropped, never squashed)
  const k = Math.max(w / im.naturalWidth, h / im.naturalHeight), sw = w / k, sh = h / k;

  }

  /* dim the undug part of the elevator column */
  g.fillStyle = "#0e0a07"; g.fillRect(shX, dimTop, SW, MAXS * RH - N() * RH - (dimTop - lockedTop));

  /* hoist wheel (on the station), cable and cabin. The cabin is drawn after (in front of) every shaft section, tunnel and row */
  const a = T * (S.el.t < 0 ? 0 : 5), wy = ER.y + 24;
  g.strokeStyle = "#ffc83d"; g.lineWidth = 3; g.beginPath(); g.arc(sx, wy, 12, 0, 7); g.moveTo(sx + Math.cos(a) * 12, wy + Math.sin(a) * 12); g.lineTo(sx - Math.cos(a) * 12, wy - Math.sin(a) * 12); g.stroke();
  const E = S.el, trip = tripE(), f = E.t < 0 ? 0 : E.t < trip ? E.t / trip : 1 - (E.t - trip) / trip;
  const cb = L.s0 - 14 + f * N() * RH + (thD - FL - RH + 10) * Math.min(1, f * N()), CI = ART.cabin.im;
  let cw = Math.max(28, SW - 18), ch = 24;                                           // cabin size (procedural default 24 tall)
  if (CI.ok) { cw = ART.cabin.width > 0 ? Math.round(ART.cabin.width) : Math.round(SW * ART.cabin.scale); ch = Math.round(cw * CI.naturalHeight / CI.naturalWidth); }   // spans the shaft channel
  const ct = cb - 2 - ch;                                                            // cabin top; its bottom rests at cb - 2
  if (wy + 12 < ct) { g.strokeStyle = "#999"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(sx, wy + 12); g.lineTo(sx, ct); g.stroke(); }
  const cx = CI.ok ? Math.round(shX + (SW - cw) / 2) : Math.round(sx - cw / 2);       // sprite cabin: flush with the shaft / station edges
  g.save();
  if (CI.ok) { g.beginPath(); g.rect(0, SH, w, MAXS * RH + 200); g.clip(); }          // sprite cabin is as wide as the station: show only the part below the surface
  if (CI.ok) g.drawImage(CI, cx, ct, cw, ch);
  else { g.fillStyle = "#c0392b"; g.fillRect(cx, ct, cw, ch); g.fillStyle = "#222"; g.fillRect(cx + 4, ct + 4, cw - 8, 12); }
  for (let k = 0; k < (E.load > 0 ? 4 : 0); k++) nugget(cx + cw * (k + 1) / 5, ct + ch * 0.55, 3);
  g.restore();

  /* floating texts */
  floats.forEach(fl => { g.globalAlpha = Math.max(0, 1 - fl.t / 1.2); txt(fl.txt, fl.x, fl.y - fl.t * 30, 14, fl.col, "center"); });
  g.globalAlpha = 1;
}

/* ---------- modal & HUD ---------- */
function modal(html, btns) {
  const b = $("#box"); b.innerHTML = html + '<div class="bt"></div>';
  btns.forEach(([t, cls, fn]) => { const e = document.createElement("button"); e.innerHTML = t; if (cls) e.className = cls; e.onclick = () => { $("#modal").classList.remove("on"); fn && fn(); }; b.lastChild.appendChild(e); });
  $("#modal").classList.add("on");
}
$("#bmode").onclick = () => { buyMode = { 1: 10, 10: 100, 100: "max", max: 1 }[buyMode]; };
$("#bad").onclick = () => rewarded(() => { S.boostT = 120; });
$("#bpre").onclick = () => {
  const n = gain(); if (!n) return;
  modal("<h2>Reinvest in the mine?</h2><div>You restart with $30 and a single shaft, but gain <b>" + n + " ★</b>. Each star adds +20% to all cash you earn, forever.</div>",
    [["Reinvest", "alt", () => { S = fresh(S.gems + n, S.total); save(); }], ["Keep digging", "", null]]);
};

/* ---------- save / offline ---------- */
function save() { try { S.ts = Date.now(); localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE));
    if (d && d.shafts && d.shafts.length) { S = Object.assign(fresh(), d); S.shafts.forEach(s => s.t = -1); S.el.t = -1; S.wh.t = -1; if (!S.cleared) S.cleared = {}; }
  } catch (e) {}
}
function offline(secs) {
  secs = Math.min(secs, 4 * 3600);
  S.boostT = Math.max(0, S.boostT - secs);
  const v = rate() * secs;
  if (secs < 30 || v <= 0) return;
  modal("<h2>Welcome back!</h2><div>Your managers mined for " + Math.floor(secs / 60) + " min and earned <b>$" + fmt(v) + "</b>.</div>",
    [["Collect", "", () => earn(v)], ["Collect 2x (ad)", "alt", () => rewarded(() => earn(v * 2))]]);
}
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); save(); gp(false); }
  else if (hiddenAt) { const s = (Date.now() - hiddenAt) / 1000; hiddenAt = 0; if (s > 5) offline(s); }
});
setInterval(save, 5000); window.addEventListener("beforeunload", save);

/* ---------- boot ---------- */
initArt(); initSprites(); load(); build(); layout();
offline((Date.now() - S.ts) / 1000);
let last = performance.now();
(function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  tick(dt); ui(); draw(); requestAnimationFrame(loop);
})(last);
</script>
</body>
